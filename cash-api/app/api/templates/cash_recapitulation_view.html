<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Receipt</title>

    <style>
        img {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .invoice-box {
            max-width: 800px;
            margin: auto;
            padding: 30px;
            border: 1px solid #eee;
            box-shadow: 0 0 10px rgba(0, 0, 0, .15);
            font-size: 16px;
            line-height: 24px;
            font-family: 'Helvetica Neue', 'Helvetica', Helvetica, Arial, sans-serif;
            color: #000;
        }
        
        .invoice-box table {
            width: 100%;
            line-height: inherit;
            text-align: left;
        }
        
        .invoice-box table td {
            padding: 5px;
            vertical-align: top;
        }
        
        .invoice-box table tr td:nth-child(2) {
            text-align: right;
        }
        
        .invoice-box table tr.top table td {
            padding-bottom: 20px;
            text-align: center;
            font-size: 16px;
        }

        .invoice-box table tr.bottom table td {
            padding-bottom: 20px;
            text-align: center;
            font-size: 16px;
        }
        .invoice-box table tr.top table td.title h3 {
            font-size: 45px;
            line-height:45px;
            color: #333;
        }
        
        .invoice-box table tr.information table td {
            padding-bottom: 40px;
        }
        
        .invoice-box table tr.heading td {            
            border-bottom: 0.5px dashed rgb(0, 0, 0);            
        }
        
        .invoice-box table tr.details td {
            padding-bottom: 20px;
        }
        .invoice-box table tr.total td:nth-child(2) {
            border-bottom: 0.5px dashed rgb(0, 0, 0);
        }
        
        @media only screen and (max-width: 600px) {
            .invoice-box table tr.top table td {
                width: 100%;
                display: block;
                text-align: center;
            }
            .invoice-box table tr.information table td {
                width: 100%;
                display: block;
                text-align: center;
            }
        }

    </style>
</head>

<body>
<div class="invoice-box">
    <table cellpadding="0" cellspacing="0">
        <tr class="item">
                <td>
                    <b>{{cash.name}}</b>
                </td>

                <td>

                </td>
        </tr>
    </table>
</div>
</body>

</html>
