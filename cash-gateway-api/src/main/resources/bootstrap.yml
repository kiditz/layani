---
spring:
  profiles: dev
  application:
    name: cash-gateway-api
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery: 
        preferIpAddress: true        
        host: ${CONSUL_HOST:localhost}
        ip-address: ${CONSUL_HOST:localhost}
        instanceId: ${spring.application.name}

      config:
        fail-fast: true
        format: yaml
endpoints:
  health:
    sensitive: false
management:
  security:
    enabled: false
  health:
    consul:
      enabled: false
